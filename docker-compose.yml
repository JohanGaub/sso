networks:
    public-dev:
        name: public-dev
        external: true
    traefik-global-proxy:
        name: traefik-global-proxy
        external: true
    back:
        driver: bridge

volumes:
    sf_var_cache:
    sf_var_ci:
    database_data:
    dependency_track_data:

services:
    php:
        container_name: ${COMPOSE_PROJECT_NAME}_php
        restart: 'always'
        build:
            context: .
            dockerfile: ./docker/php/Dockerfile
            target: dev
            args:
                - XDEBUG_ENABLE=${XDEBUG_ENABLE}
                - APP_ENV=${APP_ENV}
        environment:
            APP_ENV: ${APP_ENV}
            REDIS_HOST: redis
            REDIS_PORT: 6379
            DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}?serverVersion=${DB_SERVER_VERSION}&charset=utf8
            PHP_IDE_CONFIG: serverName=${COMPOSE_PROJECT_NAME}.docker.localhost
            SYMFONY_CONTAINER_XML_PATH: ${SYMFONY_CONTAINER_XML_PATH}
            HMR_SERVER_URL: https://theme-${COMPOSE_PROJECT_NAME}.docker.localhost
            DEFAULT_URI: http://${COMPOSE_PROJECT_NAME}.docker.localhost
        networks:
            - back
        depends_on:
            - redis
            - database
        volumes:
            - ./:/var/www/symfony
            - ./docker/php/.bashrc:/root/.bashrc
            - sf_var_cache:/var/www/symfony/var/cache:rw
            - sf_var_ci:/var/www/symfony/var/ci:rw

    nginx:
        container_name: ${COMPOSE_PROJECT_NAME}_nginx
        build:
            context: .
            dockerfile: ./docker/nginx/Dockerfile
            target: base
        depends_on:
            - php
        volumes:
            - ./public:/var/www/symfony/public
            - ./var:/var/www/symfony/var
        networks:
            - public-dev
            - traefik-global-proxy
            - back
        labels:
            - "traefik.enable=true"
            - "traefik.port=80"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_nginx.rule=Host(`${COMPOSE_PROJECT_NAME}.docker.localhost`) || Host(`${COMPOSE_PROJECT_NAME}.docker.devhost`)"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_nginx.tls=true"
            - "traefik.docker.network=traefik-global-proxy"

    database:
        image: postgres:${DB_SERVER_VERSION:-16}-alpine
        restart: "always"
        container_name: "${COMPOSE_PROJECT_NAME}_database"
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_USER: ${DB_USER}
        healthcheck:
            test: ["CMD", "pg_isready", "-d", "${DB_NAME}", "-U", "${DB_USER}"]
            timeout: 5s
            retries: 5
            start_period: 60s
        volumes:
            - database_data:/var/lib/postgresql/data:rw
        ports:
            - "5432:5432"
        networks:
            - back

    redis:
        image: redis:${REDIS_VERSION}
        restart: "always"
        container_name: "${COMPOSE_PROJECT_NAME}_redis"
        networks:
            - back

    mailcatcher:
        container_name: ${COMPOSE_PROJECT_NAME}_mailcatcher
        image: sj26/mailcatcher:latest
        restart: 'always'
        ports:
            - "1080:1080"
            - "1025:1025"
        networks:
            - back
            - public-dev
            - traefik-global-proxy
        labels:
            - "traefik.enable=true"
            - "traefik.port=1080"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_mailcatcher.rule=Host(`mail-${COMPOSE_PROJECT_NAME}.docker.localhost`) || Host(`mail-${COMPOSE_PROJECT_NAME}.docker.devhost`)"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_mailcatcher.entrypoints=websecure"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_mailcatcher.tls=true"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_mailcatcher.service=${COMPOSE_PROJECT_NAME}_mailcatcher"
            - "traefik.http.services.${COMPOSE_PROJECT_NAME}_mailcatcher.loadbalancer.server.port=1080"
            - "traefik.docker.network=traefik-global-proxy"

    adminer:
        container_name: ${COMPOSE_PROJECT_NAME}_adminer
        restart: 'always'
        image: adminer:latest
        depends_on:
            - database
        networks:
            - public-dev
            - traefik-global-proxy
            - back
        labels:
            - "traefik.enable=true"
            - "traefik.port=8080"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_adminer.rule=Host(`adminer-${COMPOSE_PROJECT_NAME}.docker.localhost`) || Host(`adminer-${COMPOSE_PROJECT_NAME}.docker.devhost`)"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_adminer.entrypoints=websecure"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_adminer.tls=true"
            - "traefik.docker.network=traefik-global-proxy"

    dependency-track-api:
        container_name: ${COMPOSE_PROJECT_NAME}_dependency-track-api
        image: dependencytrack/apiserver:latest
        restart: 'always'
        environment:
            ALPINE_DATABASE_MODE: external
            ALPINE_DATABASE_URL: jdbc:postgresql://dependency-track-database:5432/dtrack
            ALPINE_DATABASE_DRIVER: org.postgresql.Driver
            ALPINE_DATABASE_USERNAME: ${DEPENDENCY_TRACK_DB_USER:-dtrack}
            ALPINE_DATABASE_PASSWORD: ${DEPENDENCY_TRACK_DB_PASSWORD:-dtrack}
            ALPINE_DATABASE_POOL_ENABLED: "true"
            ALPINE_DATABASE_POOL_MAX_SIZE: 20
            ALPINE_DATABASE_POOL_MIN_IDLE: 10
            ALPINE_LOG_LEVEL: INFO
        depends_on:
            dependency-track-database:
                condition: service_healthy
        networks:
            - back
            - traefik-global-proxy
        labels:
            - "traefik.enable=true"
            - "traefik.port=8080"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_dependency-track-api.rule=Host(`dependency-track-api-${COMPOSE_PROJECT_NAME}.docker.localhost`) || Host(`dependency-track-api-${COMPOSE_PROJECT_NAME}.docker.devhost`)"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_dependency-track-api.entrypoints=websecure"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_dependency-track-api.tls=true"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_dependency-track-api.service=${COMPOSE_PROJECT_NAME}_dependency-track-api"
            - "traefik.http.services.${COMPOSE_PROJECT_NAME}_dependency-track-api.loadbalancer.server.port=8080"
            - "traefik.docker.network=traefik-global-proxy"

    dependency-track-frontend:
        container_name: ${COMPOSE_PROJECT_NAME}_dependency-track-frontend
        image: dependencytrack/frontend:latest
        restart: 'always'
        environment:
            API_BASE_URL: https://dependency-track-api-${COMPOSE_PROJECT_NAME}.docker.localhost
        depends_on:
            - dependency-track-api
        networks:
            - back
            - traefik-global-proxy
        labels:
            - "traefik.enable=true"
            - "traefik.port=8080"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_dependency-track.rule=Host(`dependency-track-${COMPOSE_PROJECT_NAME}.docker.localhost`) || Host(`dependency-track-${COMPOSE_PROJECT_NAME}.docker.devhost`)"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_dependency-track.entrypoints=websecure"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_dependency-track.tls=true"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_dependency-track.service=${COMPOSE_PROJECT_NAME}_dependency-track-frontend"
            - "traefik.http.services.${COMPOSE_PROJECT_NAME}_dependency-track-frontend.loadbalancer.server.port=8080"
            - "traefik.docker.network=traefik-global-proxy"

    dependency-track-database:
        container_name: ${COMPOSE_PROJECT_NAME}_dependency-track-database
        image: postgres:${DB_SERVER_VERSION:-16}-alpine
        restart: 'always'
        environment:
            POSTGRES_DB: ${DEPENDENCY_TRACK_DB_NAME:-dtrack}
            POSTGRES_USER: ${DEPENDENCY_TRACK_DB_USER:-dtrack}
            POSTGRES_PASSWORD: ${DEPENDENCY_TRACK_DB_PASSWORD:-dtrack}
        healthcheck:
            test: ["CMD", "pg_isready", "-d", "${DEPENDENCY_TRACK_DB_NAME:-dtrack}", "-U", "${DEPENDENCY_TRACK_DB_USER:-dtrack}"]
            timeout: 5s
            retries: 5
            start_period: 30s
        volumes:
            - dependency_track_data:/var/lib/postgresql/data:rw
        networks:
            - back
